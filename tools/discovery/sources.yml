# Seed sources for the weekly funding-discovery routine (skill: discover-funding).
# Aggregators list many calls from many funders; funders post their own calls.
# Keep this list curated — add/remove as sources prove useful or go stale.

aggregators:
  - name: VANSA Arts Opportunities
    url: https://vansa.co.za/arts-opportunities/
    note: Most SA-focused; visual arts. Primary source.
  - name: ART AFRICA Magazine
    url: https://artafricamagazine.org/
    note: Pan-African contemporary art open calls/prizes/residencies.
  - name: Music In Africa — Opportunities
    url: https://www.musicinafrica.net/opportunities
    note: High-volume, dated; music-led but broader arts.
  - name: On the Move — Africa
    url: https://on-the-move.org/regions/africa
    note: Cultural mobility funding; filter to Africa/SA.
  - name: On the Move — South Africa
    url: https://on-the-move.org/regions/south-africa
  - name: Res Artis — Open Calls
    url: https://resartis.org/open-calls/
    note: Residencies worldwide; filter for SA/Africa. Use search filter "South Africa" for local hosts.
  - name: TransArtists — Open Calls
    url: https://www.transartists.org/en/other-open-calls
    note: Residencies + "Funding in Africa" guide.
  - name: Opportunity Desk — Grants
    url: https://opportunitydesk.org/category/grants/
    note: Broad; needs arts/culture keyword filtering.
  - name: grantZA — Arts, Culture & Innovation
    url: https://grantza.org.za/arts-innovation
    note: SA-focused aggregator listing NAC, NRF, TIA and other SA grants. Good primary check.
  - name: South African Cultural Observatory — Funding News
    url: https://www.southafricanculturalobservatory.org.za/news/funding-opportunities
    note: SACO monitors the creative industries sector; funding news section lists current calls.
  - name: interartsfunding.com — Open Calls
    url: https://www.interartsfunding.com/opencalls
    note: International arts funding aggregator; filter by region. Good for international calls open to SA.
  - name: fundsforNGOs — Arts & Culture
    url: https://www2.fundsforngos.org/arts-culture/
    note: Broad NGO funding database; filter to arts/culture. Covers many SA-relevant international calls.
  - name: advance-africa.com — Artist Grants
    url: https://www.advance-africa.com/Artist-Grants-and-Opportunities.html
    note: Africa-focused grants database. Often picks up SA and pan-African opportunities.
  - name: Contemporary And (C&) — Opportunities
    url: https://contemporaryand.com/opportunities/
    note: Leading platform for African contemporary art; opportunities section lists open calls, residencies and prizes for African artists.
  - name: Africa Art News
    url: https://www.africaartnews.com/
    note: Pan-African art news; regularly posts open calls (surfaced the Spier Light Art 2027 call).

funders:
  - name: Electric South
    url: https://electricsouth.org
    note: VR/AR/XR & immersive new media.
  - name: National Film & Video Foundation (NFVF)
    url: https://www.nfvf.co.za
  - name: Pro Helvetia Johannesburg
    url: https://johannesburg.prohelvetia.org
  - name: Art Moves Africa
    url: https://artmovesafrica.org
  - name: Prince Claus Fund
    url: https://princeclausfund.nl/awards-and-programmes
  - name: Africa No Filter
    url: https://africanofilter.org/our-grants
  - name: Pulitzer Center
    url: https://pulitzercenter.org/grants-fellowships
  - name: Durban FilmMart Institute
    url: https://durbanfilmmart.co.za
  - name: Institute for Creative Arts (ICA), UCT
    url: https://humanities.uct.ac.za/ica
  - name: British Council Arts
    url: https://arts.britishcouncil.org/
    note: Connections Through Culture (UK–partner collaboration grants, SA eligible, annual ~June–Aug), International Collaboration Grants (UK-lead), Biennials Connect. Watch the open-calls listing.
  - name: Goethe-Institut South Africa
    url: https://www.goethe.de/ins/za/en/kul/kul.html
    note: "Two key programmes — (1) Project Space (GPS): seed grants up to R100k for rural/peri-urban artistic projects in SA, Lesotho and Eswatini; annual call ~Aug–Sept for following year. (2) Africa-Europe Partnerships for Culture (AEPC): mobility grants up to €4k (quarterly cut-offs) and visual-art collaboration grants up to €20k (annual). May block bots — check the cultural funding page manually."
  - name: Institut Français / IFAS South Africa
    url: https://frenchinstitute.org.za/
    note: French cultural diplomacy in SA. Key programmes — Création Africa (cultural entrepreneurship incubation, €15k–€30k support, annual); Open Call for Immersive Artist Teams (R500k–R1.2M, archival digital storytelling); Cité des arts residency prizes. Check frenchinstitute.org.za and on-the-move.org.
  - name: Hivos — African Crossroads
    url: https://hivos.org/program/african-crossroads/
    note: Collaboration grants up to €25k for organisations and individuals working across arts, culture, heritage and technology in Africa (North, East and Southern Africa). Peer-to-peer learning focus. Email proposals.hubsaf@hivos.org or watch for open call announcements.
  - name: Nirox Foundation (artist residencies)
    url: https://niroxfoundation.com/
    note: International artist residency at Nirox Sculpture Park, Cradle of Humankind, Gauteng. Visual art, sculpture and interdisciplinary. Annual call via Res Artis (~Aug deadline for Jan–Jun residency). Fully funded.
  - name: University of Johannesburg Artists in Residence
    url: https://on-the-move.org/news/university-johannesburg-artist-residence-programme-south-africa-remote
    note: Rolling AiR programme, physical and remote formats. Preference for African-linked artists. Check UJ Department of Visual Art and On the Move listing.
  - name: Oppenheimer Memorial Trust (OMT)
    url: https://www.omt.org.za/
    note: SA foundation supporting arts & culture organisations and practitioners, plus education and policy. Invitation-based but does accept unsolicited letters of inquiry. Arts & culture is an explicit sector — contact applicationqueries@omt.org.za.
  - name: National Arts Festival (Standard Bank Young Artist)
    url: https://nationalartsfestival.co.za/
    note: Standard Bank Young Artist Awards — annual, 5 disciplines, cash + production budget; nominations open ~August each year (self-nominations not accepted). Also watch the curated programme call for artists (~October deadline for following July festival).
  - name: IDFA Bertha Fund
    url: https://professionals.idfa.nl/training-funding/funding/about-the-idfa-bertha-fund/
    note: Creative documentary, SA typically eligible; annual dev/production/post grants.
  - name: Sundance Institute Documentary Fund
    url: https://www.sundance.org/programs/documentary-fund
    note: Global nonfiction; rolling windows. SA eligible.
  - name: Commonwealth Foundation — Culture & Diversity
    url: https://commonwealthfoundation.com/grants/annual/
    note: Annual grants up to £60k (£15k–£30k/yr, 2-yr max) to Commonwealth CSOs. SA eligible. Three strands (health justice, climate justice, freedom of expression) — culture strand fits freedom of expression. Open ~September each year; closed for 2025/26 cycle, reopens Sept 2026.
  - name: Pollock-Krasner Foundation
    url: https://www.pkf.org/apply/how-to-apply/
    note: Rolling need-based grants for professional visual artists worldwide (incl. SA); painters, sculptors, works on paper. No deadline.
  - name: Ampersand Foundation
    url: https://www.theampersandfoundation.com/how-to-apply
    note: Funded NY residency for professional SA contemporary visual artists; annual cycle.
  - name: Tierney Fellowship (Photography)
    url: https://marketphotoworkshop.co.za/projects/mentorships-residencies/tierney-fellowship/
    note: Emerging SA photographers, R50k + year-long mentorship; via Market Photo Workshop, Wits, Michaelis. Annual.
  - name: Bag Factory Artists' Studios
    url: https://www.bagfactoryart.org.za/category/artist-opportunities/
    note: Joburg studio complex with international residencies plus two flagship annual awards — Cassirer Welz Award (emerging Sub-Saharan artists, 3-month funded residency + solo show + stipend, with Strauss & Co; 2026 winner announced June) and David Koloane Award. Watch the artist-opportunities page.
  - name: SAMRO Foundation
    url: https://www.samrofoundation.org.za/
    note: Music funding — annual student bursaries (SA, Botswana, Lesotho, Eswatini), the prestigious SAMRO Overseas Scholarships (jazz + Western art music, alternating cycles), and the SAMRO Music Creation Support Fund for composers.
  - name: Jakes Gerwel Foundation
    url: https://jgf.org.za/residencies/
    note: Funded writers' residencies at Paulet House (Somerset East) — Second Book residency, PEN Afrikaans/PEN SA partnerships, screenwriting mentorships with M-Net. Rolling calls per programme on the residencies page.
  - name: Thami Mnyele Foundation
    url: https://www.thami-mnyele.nl/
    note: 3-month funded Amsterdam residency for African visual artists (all contemporary media) — accommodation, studio and €850/month allowance; ~2 full residencies/year. Apply via online form; check current deadline.
  - name: Spier Arts Trust / Spier Light Art
    url: https://spierlightart.co.za/
    note: Annual open call (~June–July deadline) for light-art commissions at Spier Wine Farm, Stellenbosch — artist fee + production budget. Spier Arts Trust also runs the Creative Block artwork-purchase programme for SA artists.
  - name: Rijksakademie van beeldende kunsten
    url: https://www.rijksakademie.nl/en/residency
    note: Amsterdam; one of the world's top-tier funded residencies, open to artists worldwide incl. SA. Annual open call, typically ~Dec–Feb window.

# Organisational capacity-building / core-support funders (for arts ORGANISATIONS).
# These power the "Capacity building" and "VANSA (org)" lenses — most run annual or
# multi-year cycles, so re-check them each run and add when a window is open.
capacity_building:
  - name: African Culture Fund (ACF) — SOFACO
    url: https://www.africanculturefund.net/en/
    note: Organisational structuring grants (governance, fundraising, M&E) up to €5k; recurring SOFACO calls; pan-African incl. SA. May block bots — try the "call for projects" page.
  - name: National Arts Council (NAC) — Arts Organisation Support Funding
    url: https://www.nac.org.za/funding-news/funding-overview/
    note: Three-year org support for registered SA arts organisations; annual/triennial cycle (2025–2028 call closed 23 Jan 2026) — watch for the next call.
  - name: UNESCO — International Fund for Cultural Diversity (IFCD)
    url: https://www.unesco.org/creativity/en/ifcd/apply
    note: Up to US$100k for structural/capacity projects; annual call via the SA National Commission (2026/17th call closed 6 May 2026) — watch for the next call.
  - name: Business and Arts South Africa (BASA)
    url: https://www.basa.co.za
    note: Supporting Grants + skills/mentorship; already in dataset.
  - name: Oppenheimer Memorial Trust (OMT) — Arts & Culture
    url: https://www.omt.org.za/
    note: SA foundation making grants to PBOs in arts & culture — both individual and organisational support. Invitation-preferred but unsolicited LOIs accepted; contact applicationqueries@omt.org.za.

# Government grants programmes (non-tender). These have annual competitive open calls
# distinct from the procurement tenders below.
government_grants:
  - name: DSAC — Mzansi Golden Economy (MGE)
    url: https://www.dsac.gov.za/Revised%20Mzansi-Golden-Economy-MGE-2025/2026-Open%20Call
    note: SA's LARGEST competitive arts grant (up to R2M per beneficiary). Open to SA arts, culture and heritage NPOs and Pty Ltd. Two streams — Cultural & Creative Industries Projects (CCIPs) and Touring Ventures. Annual open call ~Dec–Jan via eservices.gov.za. Watch dsac.gov.za for each year's guidelines PDF.
  - name: NAC — Annual Project Funding
    url: https://www.nac.org.za/new-call-for-the-nac-annual-project-funding-applications-for-2026-2027/
    note: Up to R350k per project for individual practitioners and registered organisations across all disciplines. Annual cycle, typically Jan–March deadline; apply via nac.praxisgms.co.za. Also check grantZA for current call status.
  - name: Western Cape Dept of Cultural Affairs and Sport
    url: https://www.westerncape.gov.za/cas/service/arts-and-culture-funding
    note: Annual provincial grants R50k–R500k for arts, culture and heritage in the Western Cape. Open to individuals, orgs and events companies. Next call typically Dec; 2026/27 closed 9 March 2026.
  - name: Gauteng Dept of Sport, Arts, Culture and Recreation
    url: https://gautengfilm.org.za/
    note: Annual call for arts, sport and culture events/festivals for Gauteng projects; 2026/27 closed March 20, 2026. Watch DSACR and Gauteng Film Commission site for next call.
  - name: KZN Dept of Sport, Arts and Culture
    url: https://provincialgovernment.co.za/units/view/44/kwazulu-natal/arts-and-culture
    note: Provincial arts and culture funding for KZN-based organisations. Check their annual call timelines.
  - name: eThekwini Municipality — Arts and Culture Grant-in-Aid
    url: https://ethekwini.org.za/
    note: Annual Grant-in-Aid for NPOs/NPCs in performing arts and culture within eThekwini Metro (Durban). Deadline typically February; 2025/26 closed Feb 15, 2026. Applications from ethekwini.gov.za.
  - name: Eastern Cape Provincial Arts and Culture Council (PACC)
    url: https://www.ecpacc.org.za/
    note: Provincial arts funder for Eastern Cape organisations and practitioners; watch for annual open calls.
  - name: Goethe-Institut — Project Space (GPS)
    url: https://www.goethe.de/ins/za/en/kul/kul/psg.html
    note: Annual seed grants up to R100k for 3 projects in rural/peri-urban SA, Lesotho, Eswatini. Call opens ~Aug, deadline ~Sept; applications to gpsapplications@goethe.de. 2026 cycle in implementation; next call expected Sept 2026.
  - name: National Heritage Council (NHC) — Heritage Funding
    url: https://www.nhc.org.za/funding/
    note: Annual heritage project funding for community-based orgs (NPOs, NPCs, CBOs, educational institutions, community trusts) — research, documentation, digitisation, education. Apply via Praxis portal; 2026/27 call closed 15 May 2026, next expected ~April 2027.
  - name: Gauteng Film Commission
    url: https://gautengfilm.org.za/
    note: Production, development and marketing funding for Gauteng-based film/TV; also republishes DSAC calls. Periodic funding windows.
  - name: KZN Film Commission
    url: https://kwazulunatalfilm.co.za/
    note: Film fund for KZN productions — development, production, post and marketing; periodic calls.
  - name: Presidential Employment Stimulus (PESP) — arts sector rounds
    url: https://www.nac.org.za/
    note: Large government stimulus rounds for the cultural sector administered via NAC/DSAC/NHC (e.g. PESP7 heritage round). Irregular but high-value — check NAC, DSAC and NHC news pages each run.

# Government tender portals (procurement). These list ALL government tenders, so
# keyword-filter HARD to arts/culture/heritage/museum/public-art/creative-industries,
# and confirm each tender's per-bid closing date before proposing it as "open".
tenders:
  - name: eTenders OCDS API (national) — preferred
    url: https://ocds-api.etenders.gov.za/swagger/index.html
    note: Structured Open Contracting (OCDS) JSON feed of ALL govt tenders. Use the helper `python3 tools/discovery/fetch_tenders.py` (stdlib) which queries it, keyword-filters to arts/culture/heritage, and emits ready-shaped candidates. Robust — no HTML scraping. Portal mirror for humans → https://www.etenders.gov.za/Home/opportunities?id=1
  - name: DSAC — Tenders (national)
    url: https://www.dsac.gov.za/qt-tenders
    note: National Dept of Sport, Arts & Culture; also provincial DSAC/SAC sites (KZN, Limpopo, Northern Cape, Free State, Eastern Cape).

# Notes for the routine:
# - Several of these (Mophradat, ArtConnect, VANSA, On the Move, Res Artis, Music In Africa,
#   African Culture Fund, NAC, UNESCO, Goethe-Institut) block generic bot user-agents; prefer
#   their RSS/sitemap, else skip + flag for manual check.
# - Time-sensitive examples seen during research: Doc Society Climate Story Fund,
#   Future Generation Art Prize — always confirm the live deadline before proposing as "open".
# - Capacity-building org funders are scarce and mostly annual — the NAC AOSF and UNESCO IFCD
#   calls above had just closed at last check; re-add them automatically when they reopen.
# - Government grants (MGE, NAC Project Funding, Western Cape) are large and highly relevant —
#   always check their current call status each weekly run, as they open once per year.
# - Corporate CSI: Standard Bank sponsors the Young Artist Awards (nominations via National Arts
#   Festival); Absa backs L'Atelier; Sasol backs New Signatures. These are award/prize-based CSI.
#   BASA's Supporting Grants are the main channel for business-arts partnership funding.
